name: Run tests

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Set up services and run tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Setup Allure
        run: sudo npm install -g allure-commandline

      - name: Set up services
        run: |
            # Попробуем зайти в папку без пробела
            cd infra/docker_compose 2>/dev/null || \
            # Если не получилось, пробуем варианты с пробелами (в кавычках!)
            cd "infra /docker_compose" 2>/dev/null || \
            cd "infra/ docker_compose" 2>/dev/null || \
            cd "infra / docker_compose"
            
            # Запускаем скрипт
            bash restart-docker.sh

      - name: Run tests
        run: ./mvnw clean test -q -DbrowserVersion=120.0
        env:
          APIBASEURL: http://localhost:4111
          UIBASEURL: http://frontend
          APIVERSION: /api/v1

      - name: Run Swagger coverage
        if: always()
        continue-on-error: true
        run: |
          if [ -f .swagger-coverage-commandline/bin/swagger-coverage-commandline ]; then
            .swagger-coverage-commandline/bin/swagger-coverage-commandline \
              -s http://localhost:4111/v3/api-docs \
              -i target/swagger-coverage-output
          else
            echo "swagger-coverage-commandline not found, skipping"
          fi

      - name: Load test report history
        uses: actions/checkout@v4
        if: always()
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report
        if: always()
        run: |
          mkdir -p allure-history
          if [ -d gh-pages/latest/history ]; then
            mkdir -p target/allure-results/history
            cp -r gh-pages/latest/history/* target/allure-results/history/
          fi
          allure generate target/allure-results -o allure-history/${{ github.run_number }} --clean
          rm -rf allure-history/latest
          cp -r allure-history/${{ github.run_number }} allure-history/latest
          echo '<meta http-equiv="refresh" content="0; url=latest/index.html">' > allure-history/index.html

      - name: Add Swagger coverage report
        if: always()
        continue-on-error: true
        run: |
          if [ -f swagger-coverage-report.html ]; then
            cp swagger-coverage-report.html allure-history/${{ github.run_number }}/
          fi

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true

      - name: Clean up services
        if: always()
        run: |
            cd infra/docker_compose 2>/dev/null || \
            cd "infra /docker_compose" 2>/dev/null || \
            cd "infra/ docker_compose" 2>/dev/null || \
            cd "infra / docker_compose"
            
            docker compose down
          
      - name: Print report links
        if: always()
        run: |
            echo "### 📊 Отчеты доступны по ссылкам:" >> $GITHUB_STEP_SUMMARY
            echo "* [Allure Report (Latest)](https://svetlanazhukova-qa.github.io/nbank-tests-new/latest/index.html)" >> $GITHUB_STEP_SUMMARY
            echo "* [Swagger Coverage (Run ${{ github.run_number }})](https://svetlanazhukova-qa.github.io/nbank-tests-new/${{ github.run_number }}/swagger-coverage-report.html)" >> $GITHUB_STEP_SUMMARY
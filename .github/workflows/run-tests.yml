name: Run tests

# триггер
on: [ push, workflow_dispatch ]

jobs: # аналог этапов
  run-tests:
    name: Set up services (review apps) and run tests
    runs-on: ubuntu-latest
    permissions:
      contents: write # даем права на запись в репозиторий для публикации в gh-pages

    steps: # шаги конкретной job
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Set up Node.js # Нужен для установки Allure
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up services
        run: cd infra/docker_compose && bash restart-docker.sh && cd ../..

      - name: Run tests
        run: ./mvnw test -Dtest=ChangeNameOfUserTestUI -q
        env:
          APIBASEURL: http://localhost:4111
          UIBASEURL: http://frontend
          BROWSER_VERSION: "120.0"

      - name: Run Swagger coverage
        if: always()
        continue-on-error: true
        run: .swagger-coverage-commandline/bin/swagger-coverage-commandline -s http://localhost:4111/v3/api-docs -i target/swagger-coverage-output

      - name: Load test report history
        uses: actions/checkout@v4
        if: always()
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build test report
        if: always()
        run: |
          sudo npm install -g allure-commandline
          # Копируем историю из предыдущих запусков (если она есть)
          if [ -d gh-pages/history ]; then
            mkdir -p target/allure-results/history
            cp -r gh-pages/history target/allure-results/history
          fi
          # Генерируем отчет
          allure generate target/allure-results -o allure-report
          # Копируем сгенерированный отчет в папку с номером текущего запуска
          mkdir -p allure-history
          cp -r allure-report allure-history/${{ github.run_number }}
          # Сохраняем историю для будущих запусков
          if [ -d target/allure-results/history ]; then
            cp -r target/allure-results/history allure-history/history
          fi
          # Создаем index.html, который будет автоматически перенаправлять на последний запуск
          echo '<meta http-equiv="refresh" content="0; url=./${{ github.run_number }}/index.html">' > allure-history/index.html

      - name: Build Swagger coverage report
        if: always()
        continue-on-error: true
        run: sudo cp swagger-coverage-report.html allure-history/${{ github.run_number }}

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true # Сохраняем файлы от старых запусков

      - name: Clean up services
        if: always()
        run: cd infra/docker_compose && docker compose down
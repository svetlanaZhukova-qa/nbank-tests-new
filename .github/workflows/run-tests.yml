name: Run tests

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Set up services (review apps) and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install Swagger Coverage
        run: |
          unzip -o swagger-coverage-1.5.0.zip -d swagger-coverage-temp
          mkdir -p .swagger-coverage-commandline
          cp -r swagger-coverage-temp/swagger-coverage-1.5.0/* .swagger-coverage-commandline/
          chmod +x .swagger-coverage-commandline/bin/swagger-coverage-commandline

      - name: Set up services
        run: |
          cd infra/docker_compose
          bash restart-docker.sh
        continue-on-error: false

      - name: Run tests
        run: ./mvnw clean test -q
        env:
          APIBASEURL: http://localhost:4111
          UIBASEURL: http://frontend
          APIVERSION: /api/v1

      - name: Run Swagger coverage
        if: always()
        run: |
          .swagger-coverage-commandline/bin/swagger-coverage-commandline \
            -s http://localhost:4111/v3/api-docs \
            -i target/swagger-coverage-output || true

      - name: Load test report history
        uses: actions/checkout@v4
        if: always()
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build test report
        if: always()
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure-2.27.0.tgz
          mkdir -p allure-history
          cp -r gh-pages/* allure-history/ 2>/dev/null || true
          ./allure-2.27.0/bin/allure generate target/allure-results -o allure-history/${{ github.run_number }} --clean
          ./allure-2.27.0/bin/allure generate target/allure-results -o allure-history/latest --clean

      - name: Build Swagger coverage report
        if: always()
        run: |
          mkdir -p allure-history/${{ github.run_number }}
          cp swagger-coverage-report.html allure-history/${{ github.run_number }}/swagger-coverage-report.html || true

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true

      - name: Clean up services
        if: always()
        run: |
          cd infra/docker_compose
          docker compose down
name: Run tests

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Set up services (review apps) and run tests
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Обязательно для публикации в gh-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # === НОВЫЙ ШАГ: установка Allure через официальное действие ===
      - name: Setup Allure
        uses: sudo npm install -g allure-commandline

      - name: Set up services
        working-directory: infra/docker_compose   # ← правильно вместо cd
        run: bash restart-docker.sh

      - name: Run tests
        run: ./mvnw clean test -q
        env:
          APIBASEURL: http://localhost:4111
          UIBASEURL: http://frontend
          APIVERSION: /api/v1

      - name: Run Swagger coverage
        if: always()
        continue-on-error: true                   # ← не роняет整个 workflow
        run: |
          if [ -f .swagger-coverage-commandline/bin/swagger-coverage-commandline ]; then
            .swagger-coverage-commandline/bin/swagger-coverage-commandline \
              -s http://localhost:4111/v3/api-docs \
              -i target/swagger-coverage-output
          else
            echo "⚠️ swagger-coverage-commandline не найден — шаг пропущен"
          fi

      - name: Load test report history
        uses: actions/checkout@v4                 # ← v2 → v4
        if: always()
        with:
          ref: gh-pages
          path: gh-pages

      # === НОВАЯ генерация отчёта через allure CLI ===
      - name: Generate Allure report
        if: always()
        run: |
          mkdir -p allure-history

          # Копируем историю из предыдущего отчёта (для трендов)
          if [ -d gh-pages/latest/history ]; then
            mkdir -p target/allure-results/history
            cp -r gh-pages/latest/history/* target/allure-results/history/
          fi

          # Генерируем отчёт для текущего запуска
          allure generate target/allure-results \
            -o allure-history/${{ github.run_number }} --clean

          # Обновляем "latest" → текущий отчёт
          rm -rf allure-history/latest
          cp -r allure-history/${{ github.run_number }} allure-history/latest

          # index.html в корне — редирект на latest (решает проблему 404)
          echo '<meta http-equiv="refresh" content="0; url=latest/index.html">' \
            > allure-history/index.html

      - name: Add Swagger coverage report
        if: always()
        continue-on-error: true
        run: |
          if [ -f swagger-coverage-report.html ]; then
            cp swagger-coverage-report.html allure-history/${{ github.run_number }}/
          fi

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v4       # ← v3 → v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true                         # ← сохранять предыдущие отчёты

      - name: Clean up services
        if: always()
        working-directory: infra/docker_compose   # ← правильно вместо cd
        run: docker compose down